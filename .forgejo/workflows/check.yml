name: Check

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  lint:
    runs-on: codeberg-small
    container:
      image: node:22-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Lint Markdown
        run: npx -y markdownlint-cli@0.45.0 --disable MD001 MD003 MD013 MD033 MD041 -- "**/*.md"

      - name: Check whitespace and encoding
        run: |
          fail=0
          for f in $(git ls-files); do
            if ! iconv -f UTF-8 -t UTF-8 "$f" > /dev/null 2>&1; then
              echo "::error file=$f::not valid UTF-8"; fail=1
            fi
            if grep -nP '\r$' "$f"; then
              echo "::error file=$f::contains CRLF line endings"; fail=1
            fi
            if [ -s "$f" ] && [ -n "$(tail -c1 "$f")" ]; then
              echo "::error file=$f::missing trailing newline"; fail=1
            fi
          done
          exit $fail

  code:
    runs-on: codeberg-small
    container:
      image: python:3.13-slim
    steps:
      # checkout is a JavaScript action and needs node in the job container
      - name: Install node and git
        run: export DEBIAN_FRONTEND=noninteractive && apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs git ca-certificates > /dev/null

      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install linters
        run: pip install --no-cache-dir --root-user-action=ignore ruff==0.14.0 yamllint==1.37.1

      - name: Lint and format-check Python
        run: |
          ruff check scripts
          ruff format --check --diff scripts
          python -m py_compile scripts/*.py

      - name: Lint workflow YAML
        run: yamllint .forgejo

      - name: Validate SVGs
        run: |
          fail=0
          for f in $(find assets -name "*.svg"); do
            python -c "import sys, xml.etree.ElementTree as E; E.parse(sys.argv[1])" "$f" \
              || { echo "::error file=$f::invalid SVG/XML"; fail=1; }
          done
          exit $fail

  links:
    runs-on: codeberg-small
    container:
      image: node:22-bookworm
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Check links in README.md
        run: |
          fail=0
          for link in $(grep -oE '\]\([^)]+\)' README.md | sed -E 's/^\]\((.*)\)$/\1/' | grep -vE '^(https?:|mailto:|#)'); do
            if [ -e "$link" ]; then
              echo "OK   $link"
            else
              echo "::error::missing local file: $link"; fail=1
            fi
          done
          for url in $(grep -oE 'https?://[^] )"<>]+' README.md | sort -u); do
            code=$(curl -s -o /dev/null -L -w '%{http_code}' --retry 3 --retry-all-errors --max-time 30 "$url" || true)
            case "$code" in
              2??|3??) echo "OK   $code $url" ;;
              403|429) echo "::warning::$code (likely bot protection) $url" ;;
              *)       echo "::error::$code $url"; fail=1 ;;
            esac
          done
          exit $fail
